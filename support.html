<script>
  // Animate reveal
  const revealElements = document.querySelectorAll('.fade-in, .slide-up, .zoom-in');
  function revealOnScroll() {
    revealElements.forEach(el => {
      const rect = el.getBoundingClientRect();
      if (rect.top < window.innerHeight - 50) {
        el.classList.add('visible');
      }
    });
  }
  window.addEventListener('scroll', revealOnScroll);
  window.addEventListener('load', revealOnScroll);

  // Support form → send to backend + redirect to Razorpay
  document.getElementById("supportForm").addEventListener("submit", async function(e) {
    e.preventDefault();

    const data = {
      name: document.getElementById("name").value,
      email: document.getElementById("email").value,
      service: document.getElementById("service").value,
      details: document.getElementById("details").value,
      date: new Date().toISOString()
    };

    try {
      const res = await fetch("http://localhost:5000/support", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify(data)
      });

      const result = await res.json();
      document.getElementById("statusMsg").textContent = result.message || "✅ Request submitted successfully!";

      // 🔹 Redirect to Razorpay after saving
      setTimeout(() => {
        window.location.href = "https://rzp.io/rzp/dzwmGR7Q";
      }, 1500);

    } catch (err) {
      document.getElementById("statusMsg").textContent = "❌ Failed to submit request!";
      console.error(err);
    }
  });
</script>
